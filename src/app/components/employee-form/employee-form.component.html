<div class="dialog-container">
  <div class="dialog-header">
    <h2 mat-dialog-title>
      <mat-icon class="title-icon">badge</mat-icon>
      {{ isEditMode ? 'Modifier employé' : 'Nouvel employé' }}
    </h2>
    <button mat-icon-button (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="rh-form">
      <div class="form-section">
        <h3 class="section-title">Informations de base</h3>
        
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Prénom *</mat-label>
            <input matInput formControlName="firstName">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Nom *</mat-label>
            <input matInput formControlName="lastName">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Email *</mat-label>
            <input matInput formControlName="email" type="email">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Téléphone *</mat-label>
            <input matInput formControlName="phoneNumber" type="tel">
          </mat-form-field>
        </div>
      </div>

      <div class="form-section">
        <h3 class="section-title">Informations professionnelles</h3>
        
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Date d'embauche *</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="hireDate">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Poste *</mat-label>
            <input matInput formControlName="position">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Département *</mat-label>
            <mat-select formControlName="departmentId">
              <mat-option *ngFor="let department of departments" [value]="department.id">
                {{ department.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Statut *</mat-label>
            <mat-select formControlName="status">
              <mat-option *ngFor="let status of statuses" [value]="status">
                {{ status }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Annuler</button>
    <button mat-raised-button color="primary" 
            type="submit"
            [disabled]="!employeeForm.valid || loading"
            (click)="onSubmit()">
      {{ loading ? 'Envoi...' : (isEditMode ? 'Mettre à jour' : 'Créer') }}
    </button>
  </mat-dialog-actions>
</div>
