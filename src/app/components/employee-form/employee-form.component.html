<div class="dialog-container">
  <div class="dialog-header">
    <h2>{{ isEditMode ? 'Modifier employé' : 'Ajouter un nouvel employé' }}</h2>
    <button mat-icon-button (click)="onCancel()" class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  
  <p class="dialog-subtitle">Remplissez les informations {{ isEditMode ? 'de l\'employé' : 'du nouvel employé' }}</p>

  <div class="dialog-content">
    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
      <!-- Première ligne -->
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Prénom</label>
          <input id="firstName" type="text" formControlName="firstName" placeholder="Prénom">
        </div>

        <div class="form-group">
          <label for="lastName">Nom</label>
          <input id="lastName" type="text" formControlName="lastName" placeholder="Nom">
        </div>
      </div>

      <!-- Deuxième ligne -->
      <div class="form-row">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="email@example.com">
        </div>

        <div class="form-group">
          <label for="phoneNumber">Téléphone</label>
          <input id="phoneNumber" type="tel" formControlName="phoneNumber" placeholder="Téléphone">
        </div>
      </div>

      <!-- Troisième ligne -->
      <div class="form-row">
        <div class="form-group">
          <label for="date">Date d'embauche</label>
          <div class="date-input-wrapper">
            <input id="date" type="date" formControlName="hireDate" placeholder="jj/mm/aaaa">
            <mat-icon class="date-icon">calendar_today</mat-icon>
          </div>
        </div>

        <div class="form-group">
          <label for="poste">Poste</label>
          <input id="poste" type="text" formControlName="position" placeholder="Poste">
        </div>
      </div>

      <!-- Quatrième ligne -->
      <div class="form-row">
        <div class="form-group">
          <label for="departement">Département</label>
          <div class="select-wrapper">
            <select id="departement" formControlName="departmentId">
              <option value="" disabled>Sélectionnez un département</option>
              <option *ngFor="let department of departments" [value]="department.id">
                {{ department.name }}
              </option>
            </select>
            <mat-icon class="select-icon">expand_more</mat-icon>
          </div>
        </div>

        <div class="form-group">
          <label for="statut">Statut</label>
          <div class="select-wrapper">
            <select id="statut" formControlName="status">
              <option *ngFor="let status of statuses" [value]="status">
                {{ status }}
              </option>
            </select>
            <mat-icon class="select-icon">expand_more</mat-icon>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="dialog-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">Annuler</button>
        <button type="submit" class="btn-submit" [disabled]="!employeeForm.valid || loading">
          {{ loading ? 'Envoi...' : (isEditMode ? 'Mettre à jour' : 'Ajouter') }}
        </button>
      </div>
    </form>
  </div>
</div>
