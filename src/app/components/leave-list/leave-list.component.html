<div class="employee-container">
  <h2 class="title">📆 Liste des congés</h2>

  <div class="table-wrapper mat-elevation-z3" @fadeIn>
    <table mat-table [dataSource]="dataSource" matSort class="custom-table">

      <ng-container matColumnDef="employeId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Employé</th>
        <td mat-cell *matCellDef="let l">{{ l.employeId }}</td>
      </ng-container>

      <ng-container matColumnDef="dateDebut">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Début</th>
        <td mat-cell *matCellDef="let l">{{ l.dateDebut | date }}</td>
      </ng-container>

      <ng-container matColumnDef="dateFin">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Fin</th>
        <td mat-cell *matCellDef="let l">{{ l.dateFin | date }}</td>
      </ng-container>

      <ng-container matColumnDef="motif">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Motif</th>
        <td mat-cell *matCellDef="let l">{{ l.motif }}</td>
      </ng-container>

      <ng-container matColumnDef="statut">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Statut</th>
        <td mat-cell *matCellDef="let l">{{ l.statut }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let l">
          <a mat-icon-button color="primary" [routerLink]="['/leave', l.id, 'edit']">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="deleteLeave(l.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">Aucun résultat trouvé</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
  </div>

  <div class="add-button">
    <a mat-raised-button color="accent" routerLink="/leave/new">➕ Demander un congé</a>
  </div>
</div>
