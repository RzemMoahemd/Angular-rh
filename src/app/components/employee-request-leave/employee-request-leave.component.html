<div class="form-content">
  <h2 class="form-title">Nouvelle demande de congé</h2>
  <p class="form-subtitle">Remplissez le formulaire pour soumettre une demande de congé</p>

  <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()">
    <!-- Type de congé -->
    <div class="form-group">
      <label class="input-label">Type de congé*</label>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Sélectionner un type de congé</mat-label>
        <mat-select formControlName="motif" required>
          <mat-option value="PAYÉ">PAYÉ</mat-option>
          <mat-option value="RTT">RTT</mat-option>
          <mat-option value="MALADIE">MALADIE</mat-option>
          <mat-option value="SANS SOLDE">SANS SOLDE</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Dates -->
    <!-- Modifier les champs de date comme suit -->
<div class="form-row">
  <div class="form-group">
    <label class="input-label">Date de début*</label>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>jj/mm/aaaa</mat-label>
      <input matInput
             [matDatepicker]="pickerDebut"
             formControlName="dateDebut"
             [matDatepickerFilter]="dateFilter"
             placeholder="jj/mm/aaaa">
      <mat-datepicker-toggle matSuffix [for]="pickerDebut"></mat-datepicker-toggle>
      <mat-datepicker #pickerDebut></mat-datepicker>
      <mat-error *ngIf="leaveForm.get('dateDebut')?.hasError('weekend')">
        ❌ Les week-ends ne sont pas autorisés
      </mat-error>
    </mat-form-field>
  </div>

  <div class="form-group">
    <label class="input-label">Date de fin*</label>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>jj/mm/aaaa</mat-label>
      <input matInput
             [matDatepicker]="pickerFin"
             formControlName="dateFin"
             [matDatepickerFilter]="dateFilter"
             placeholder="jj/mm/aaaa">
      <mat-datepicker-toggle matSuffix [for]="pickerFin"></mat-datepicker-toggle>
      <mat-datepicker #pickerFin></mat-datepicker>
      <mat-error *ngIf="leaveForm.get('dateFin')?.hasError('weekend')">
        ❌ Les week-ends ne sont pas autorisés
      </mat-error>
    </mat-form-field>
  </div>
</div>
    <!-- Motif de précision -->
    <div class="form-group">
      <label class="input-label">Motif*</label>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Précisez le motif de votre demande de congé…</mat-label>
        <textarea matInput
                  formControlName="motifPrecision"
                  rows="3"
                  placeholder="Précisez le motif de votre demande de congé…"></textarea>
      </mat-form-field>
    </div>

    <!-- Actions -->
    <div class="action-buttons">
      <button mat-stroked-button type="button" (click)="onCancel()">Annuler</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="loading">
        {{ loading ? 'Envoi…' : 'Soumettre la demande' }}
      </button>
    </div>
  </form>
</div>
