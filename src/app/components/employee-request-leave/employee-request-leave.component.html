<div class="form-content">
  <div class="form-inner">
    <div class="form-header">
      <mat-icon class="form-icon">event_available</mat-icon>
      <div>
        <h2 class="form-title">Nouvelle demande</h2>
        <p class="form-subtitle">Remplissez les informations ci-dessous</p>
      </div>
    </div>

    <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()" class="compact-form">
      <!-- Type de congé -->
      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width compact-field">
          <mat-label>Type de congé*</mat-label>
          <mat-select formControlName="motif" required>
            <mat-option value="PAYÉ">
              <span class="option-text">🏖️ Congés payés</span>
            </mat-option>
            <mat-option value="RTT">
              <span class="option-text">⏰ RTT</span>
            </mat-option>
            <mat-option value="MALADIE">
              <span class="option-text">🏥 Maladie</span>
            </mat-option>
            <mat-option value="SANS SOLDE">
              <span class="option-text">💼 Sans solde</span>
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Dates en ligne -->
      <div class="dates-row">
        <mat-form-field appearance="outline" class="date-field compact-field">
          <mat-label>Date début*</mat-label>
          <input matInput
                 [matDatepicker]="pickerDebut"
                 formControlName="dateDebut"
                 [matDatepickerFilter]="dateFilter"
                 placeholder="jj/mm/aaaa">
          <mat-datepicker-toggle matSuffix [for]="pickerDebut"></mat-datepicker-toggle>
          <mat-datepicker #pickerDebut></mat-datepicker>
          <mat-error *ngIf="leaveForm.get('dateDebut')?.hasError('weekend')">
            Week-ends non autorisés
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="date-field compact-field">
          <mat-label>Date fin*</mat-label>
          <input matInput
                 [matDatepicker]="pickerFin"
                 formControlName="dateFin"
                 [matDatepickerFilter]="dateFilter"
                 placeholder="jj/mm/aaaa">
          <mat-datepicker-toggle matSuffix [for]="pickerFin"></mat-datepicker-toggle>
          <mat-datepicker #pickerFin></mat-datepicker>
          <mat-error *ngIf="leaveForm.get('dateFin')?.hasError('weekend')">
            Week-ends non autorisés
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Motif compact -->
      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width compact-field">
          <mat-label>Motif*</mat-label>
          <textarea matInput
                    formControlName="motifPrecision"
                    rows="2"
                    placeholder="Précisez le motif..."></textarea>
        </mat-form-field>
      </div>

      <!-- Actions compactes -->
      <div class="action-buttons">
        <button mat-button type="button" (click)="onCancel()" class="cancel-btn">
          Annuler
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading" class="submit-btn">
          <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
          {{ loading ? 'Envoi...' : 'Envoyer' }}
        </button>
      </div>
    </form>
  </div>
</div>
