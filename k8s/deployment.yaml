apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-angular
  labels:
    app: frontend-angular
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-angular
  template:
    metadata:
      labels:
        app: frontend-angular
    spec:
      nodeSelector:
        jenkins: "worker"
      containers:
      - name: frontend
        image: rzem/frontend-angular:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "300Mi"
            cpu: "300m

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-angular
spec:
  type: NodePort
  selector:
    app: frontend-angular
  ports:
  - protocol: TCP
    port: 80         # Port exposé dans le cluster
    targetPort: 80   # Port du container (NGINX)
    nodePort: 30080 